events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Only send "Connection: upgrade" for WebSocket requests; otherwise keep-alive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS: resolve upstream containers at request time,
    # so nginx still starts when an app container is down
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Sites rendered from templates/*.conf.template at container start
    include /etc/nginx/sites/*.conf;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }

    # Fallback server: any unknown host gets the "site not found" page with a 404
    server {
        listen 80 default_server;
        server_name _;

        access_log /var/log/nginx/fallback-access.log main;
        error_log /var/log/nginx/fallback-error.log warn;

        root /usr/share/nginx/html;
        error_page 404 /fallback.html;

        location / {
            return 404;
        }

        location = /fallback.html {
            internal;
        }
    }
}
