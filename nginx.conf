events { }

http {
    # Main server
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }

    # Fallback server (catch-all)
    server {
        listen 80 default_server;
        server_name _;  # catch all unmatched domains

        location / {
            root /usr/share/nginx/html;
            index fallback.html;
        }
    }
}
