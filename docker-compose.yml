services:
  nginx:
    image: nginx:1.30-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    networks:
      - nginx-network
    volumes:
      - ./html:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./custom-nginx:/etc/nginx/custom:ro
      - ./logs:/var/log/nginx

networks:
  nginx-network:
    name: nginx-network
    driver: bridge
