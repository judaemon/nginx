services:
  nginx:
    image: nginx:1.30-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    networks:
      - nginx-network
    env_file: .env
    environment:
      # Render templates/*.template here instead of conf.d (which holds the image's default.conf)
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/sites
    tmpfs:
      - /etc/nginx/sites
    volumes:
      - ./html:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates:/etc/nginx/templates:ro
      - ./logs:/var/log/nginx

networks:
  nginx-network:
    name: nginx-network
    driver: bridge
